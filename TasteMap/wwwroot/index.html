<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TasteMap — Бронирование ресторанов для мероприятий</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #fafafa;
        }

        .container {
            max-width: 900px;
            margin: 80px auto;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 48px;
            color: #222;
        }

        p {
            font-size: 18px;
            color: #555;
            margin: 20px 0 40px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        a.btn {
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-primary {
            background: #ff6b35;
            color: white;
        }

        .btn-secondary {
            background: #eee;
            color: #333;
        }

        a.btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍽️ TasteMap</h1>
        <p>Найдите идеальное место для вашего мероприятия: свадьбы, дня рождения, корпоратива или ужина с друзьями.</p>
        <div class="buttons">
            <a href="/login.html" class="btn btn-secondary">Войти</a>
            <a href="/register.html" class="btn btn-primary">Зарегистрироваться</a>
        </div>
    </div>
</body>
</html>
