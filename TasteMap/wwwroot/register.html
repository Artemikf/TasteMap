<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация — TasteMap</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #fafafa;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 32px;
        }

        .choice {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .card {
            padding: 30px;
            border: 2px solid #ddd;
            border-radius: 12px;
            text-decoration: none;
            color: #222;
            width: 200px;
            background: white;
        }

            .card:hover {
                border-color: #ff6b35;
            }

            .card h3 {
                margin: 0 0 10px;
            }

            .card p {
                font-size: 14px;
                color: #666;
            }

        .back {
            margin-top: 40px;
            display: inline-block;
            color: #888;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Кто вы?</h1>
        <div class="choice">
            <a href="/register-user.html" class="card">
                <h3>👤 Я гость</h3>
                <p>Хочу бронировать рестораны для мероприятий</p>
            </a>
            <a href="/register-owner.html" class="card">
                <h3>🏢 Я владелец</h3>
                <p>Хочу разместить свой ресторан на платформе</p>
            </a>
        </div>
        <a href="/" class="back">← На главную</a>
    </div>
</body>
</html>
